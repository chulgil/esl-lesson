name: Deploy

# main push → CI 통과 후 codenavi 서버 배포 (docs/architecture/deployment.md)
# 배포 본체는 리포의 scripts/deploy.sh — 커밋과 같은 버전의 스크립트가 실행된다.
# 전략: red-green(검증된 승격) — 카나리 헬스 통과 시에만 교체, 실패 시 자동 롤백.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# 배포 런 겹침 금지 — 2026-07-12 동시 빌드로 서버(2GB) OOM wedge 재발 방지.
# cancel-in-progress=false: 진행 중 배포는 완주시키고 새 런은 큐잉 (half-deployed 방지)
concurrency:
  group: deploy-codenavi
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to codenavi
    runs-on: ubuntu-latest
    # DEPLOY_ENABLED 리포지토리 변수를 'true' 로 설정해야 배포 활성화 (서버 준비 완료 후)
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: SSH deploy (red-green)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # VPS 사양상 Next.js 빌드가 10분(기본값)을 초과할 수 있음
          command_timeout: 30m
          script: |
            set -e
            cd ~/apps/eng-lesson
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh

      - name: Health check (fail -> auto rollback)
        # 컨테이너 기동이 15초를 넘겨 단발 curl 이 오탐 (2026-07-16) — 최대 2분 재시도
        id: health
        run: |
          for i in $(seq 1 12); do
            sleep 10
            if curl -sf https://esl.lessonaza.app/api/health; then
              echo " ok (try $i)"
              exit 0
            fi
            echo "health not ready ($i/12)"
          done
          exit 1

      - name: Auto rollback on health failure
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/eng-lesson
            bash scripts/deploy.sh --rollback
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf https://esl.lessonaza.app/api/health >/dev/null; then
                echo "rollback health ok (try $i)"
                exit 0
              fi
              echo "rollback health not ready ($i/12)"
            done
            echo "[!] rollback health failed - manual intervention required"
            exit 1
