name: Deploy

# main push → CI 통과 후 codenavi 서버 배포 (docs/architecture/deployment.md)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to codenavi
    runs-on: ubuntu-latest
    # DEPLOY_ENABLED 리포지토리 변수를 'true' 로 설정해야 배포 활성화 (서버 준비 완료 후)
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          # VPS 사양상 Next.js 빌드가 10분(기본값)을 초과할 수 있음
          command_timeout: 30m
          script: |
            set -e
            cd ~/apps/eng-lesson
            git fetch origin main
            git reset --hard origin/main
            export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
            # 서버 RAM 이 2GB 로 빠듯해 api+web 동시 빌드가 OOM 으로 실패 → 스테일 이미지
            # 원인(2026-07-12 실측). 서비스를 하나씩 순차 빌드하고, 이미지 소스 해시로
            # 신선도를 확인해 불일치 시 무캐시 재빌드한다.
            build_fresh() {
              svc="$1"; img="$2"
              docker-compose -f docker-compose.prod.yml build "$svc"
              IMG=$(docker run --rm --entrypoint sh "$img" -c "find app -name '*.py' 2>/dev/null | sort | xargs cat 2>/dev/null | md5sum" | cut -d' ' -f1)
              SRC=$(cd backend && find app -name '*.py' | sort | xargs cat | md5sum | cut -d' ' -f1)
              if [ "$svc" = "api" ] && [ "$IMG" != "$SRC" ]; then
                echo "[!] stale $svc image - rebuilding --no-cache"
                docker-compose -f docker-compose.prod.yml build --no-cache "$svc"
              fi
            }
            build_fresh api eng-lesson_api
            # web 신선도: 이미지에 새긴 BUILD_SHA 와 현재 커밋 비교, 다르면 무캐시 재빌드
            export GIT_SHA=$(git rev-parse HEAD)
            docker-compose -f docker-compose.prod.yml build web
            IMG_SHA=$(docker run --rm --entrypoint cat eng-lesson_web /app/BUILD_SHA 2>/dev/null || echo none)
            if [ "$IMG_SHA" != "$GIT_SHA" ]; then
              echo "[!] stale web image ($IMG_SHA != $GIT_SHA) - rebuilding --no-cache"
              docker-compose -f docker-compose.prod.yml build --no-cache web
            fi
            docker-compose -f docker-compose.prod.yml run --rm api uv run --no-dev alembic upgrade head
            # up -d 가 이미지 갱신에도 재생성 안 하는 v1 버그 → 항상 force-recreate
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f

      - name: Health check
        run: |
          sleep 15
          curl -sf https://esl.lessonaza.app/api/health
