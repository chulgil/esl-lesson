name: Deploy

# main push → CI 통과 후 codenavi 서버 배포 (docs/architecture/deployment.md)
# 전략: red-green(검증된 승격) — 러너에서 이미지 빌드(서버 무부하) → scp 전송 →
# 서버는 load→카나리 검증→교체만. 실패 시 자동 롤백.
# 빌드를 서버(2GB)에서 돌리면 라이브 서비스가 질식한다 (2026-07-28 실사용 보고).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# 배포 런 겹침 금지 — 2026-07-12 동시 빌드로 서버(2GB) OOM wedge 재발 방지.
# cancel-in-progress=false: 진행 중 배포는 완주시키고 새 런은 큐잉 (half-deployed 방지)
concurrency:
  group: deploy-codenavi
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to codenavi
    runs-on: ubuntu-latest
    # DEPLOY_ENABLED 리포지토리 변수를 'true' 로 설정해야 배포 활성화 (서버 준비 완료 후)
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      # CI 를 통과한 바로 그 커밋을 빌드 — 서버도 같은 SHA 로 리셋해 정합 보장
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build api image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          tags: eng-lesson_api:ci
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          tags: eng-lesson_web:ci
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Package images
        run: docker save eng-lesson_api:ci eng-lesson_web:ci | gzip -1 > images.tar.gz

      - name: Upload images to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: images.tar.gz
          target: ~/apps/eng-lesson/.deploy/

      - name: SSH deploy (red-green)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/apps/eng-lesson
            git fetch origin
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            bash scripts/deploy.sh

      - name: Health check (fail -> auto rollback)
        # 컨테이너 기동이 15초를 넘겨 단발 curl 이 오탐 (2026-07-16) — 최대 2분 재시도
        id: health
        run: |
          for i in $(seq 1 12); do
            sleep 10
            if curl -sf https://esl.lessonaza.app/api/health; then
              echo " ok (try $i)"
              exit 0
            fi
            echo "health not ready ($i/12)"
          done
          exit 1

      - name: Auto rollback on health failure
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/eng-lesson
            bash scripts/deploy.sh --rollback
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf https://esl.lessonaza.app/api/health >/dev/null; then
                echo "rollback health ok (try $i)"
                exit 0
              fi
              echo "rollback health not ready ($i/12)"
            done
            echo "[!] rollback health failed - manual intervention required"
            exit 1
