# 카나리(green 검증) 전용 — scripts/deploy.sh 가 승격 전에 띄우고 즉시 제거한다.
# 방금 빌드된 :latest 이미지를 트래픽 밖에서 부팅해 런타임 생존을 실증하는 용도.
# - traefiknet 미가입 + traefik.enable=false 이중 차단 → 절대 트래픽을 받지 않음
# - restart "no" → 부팅 즉사 시 그대로 죽어 있어 실패 판정이 명확
# - 순차 기동(한 번에 1개)이 전제 — 2GB 서버 RAM 보호 (docs/architecture/deployment.md)
version: "3.7"

services:
  api-canary:
    image: eng-lesson_api
    container_name: englesson-api-canary
    restart: "no"
    env_file: .env.api
    environment:
      CHAT_UPLOAD_DIR: /tmp/chat-uploads-canary # 실볼륨 미마운트 — 헬스체크에 불필요
    networks: [postgresql_internal]
    labels:
      traefik.enable: "false"

  web-canary:
    image: eng-lesson_web
    container_name: englesson-web-canary
    restart: "no"
    env_file: .env.web
    labels:
      traefik.enable: "false"

networks:
  postgresql_internal:
    external: true
