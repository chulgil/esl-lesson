# Per-feature 회귀 eval — 이 파일을 복사해 <feature-slug>.toml 로 저장하세요.
# 언더스코어(_)로 시작하는 파일은 run.py 가 건너뜁니다 (템플릿 전용).
#
# Phase 2 (cg-spec-and-harness)에서 spec §2 성공 기준 중 기계 검증 가능한
# 항목을 여기로 내립니다. 실행: python3 .harness/evals/run.py
# 게이트 편입: .cg/mechanical.toml 의 eval 주석 해제 -> cg diagnose --gate eval

[eval]
name = "feature-slug"
description = "spec §2 성공 기준 요약 — 어떤 수용 기준을 회귀로 고정하는가"
# spec = ".harness/spec/2026-07-28-feature-slug.md"   # 근거 spec (선택)

[[case]]
name = "cli-help-exits-zero"
cmd = "my-tool --help"        # 프로젝트 루트에서 실행되는 셸 명령
expect_exit = 0               # 기본 0 — 생략 가능
expect_contains = "usage"     # 선택 — stdout 부분일치
# timeout = 120               # 선택 — 초 단위 (기본 120)

[[case]]
name = "rejects-bad-input-loudly"
cmd = "my-tool --bogus-flag"
expect_exit = 2               # 실패 동작도 수용 기준이다 (조용한 실패 방지)
