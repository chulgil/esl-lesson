# 로컬 개발용: postgres 만 컨테이너로. 프론트/백엔드는 로컬 프로세스 실행 권장.
#   backend : cd backend && uv run uvicorn app.main:app --reload
#   frontend: cd frontend && npm run dev
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: englesson-dev-db
    environment:
      POSTGRES_USER: englesson
      POSTGRES_PASSWORD: englesson
      POSTGRES_DB: englesson
    ports:
      - "5432:5432"
    volumes:
      - englesson_dev_pgdata:/var/lib/postgresql/data

volumes:
  englesson_dev_pgdata:
