# codenavi 서버 배포용 — 설계: docs/architecture/deployment.md
# 사전 준비(1회): .env.web / .env.api 작성, postgres 롤/DB 생성, DNS A 레코드
version: "3.7"

services:
  web:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: englesson-web
    restart: unless-stopped
    env_file: .env.web
    networks: [traefiknet]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefiknet"
      traefik.frontend.rule: "Host:esl.lessonaza.app,esladmin.lessonaza.app"
      traefik.frontend.priority: "10"
      traefik.port: "3000"

  api:
    build: ./backend
    container_name: englesson-api
    restart: unless-stopped
    env_file: .env.api
    environment:
      CHAT_UPLOAD_DIR: /data/chat-uploads
    volumes:
      # 채팅 이미지 — 컨테이너 재생성에도 유지 (docs/specs/chat.md 이미지 전송)
      - ./data/chat-uploads:/data/chat-uploads
    networks: [traefiknet, postgresql_internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefiknet"
      traefik.frontend.rule: "Host:esl.lessonaza.app,esladmin.lessonaza.app;PathPrefix:/api,/ws"
      traefik.frontend.priority: "100"
      traefik.port: "8000"

networks:
  traefiknet:
    external: true
  postgresql_internal:
    # 기존 postgres 컨테이너가 속한 네트워크 (2026-07-11 서버 확인)
    external: true
